<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Neoware Figures</title>
    <style>
        body { background: #000; color: #fff; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
        h1 { margin: 20px 0; border: 1px solid #fff; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(20, 20px); gap: 1px; border: 1px solid #333; }
        .cell { width: 20px; height: 20px; background: #000; border: 1px solid #222; cursor: pointer; }
        .cell.active { background: #fff; }
        .controls { margin-top: 20px; display: flex; gap: 10px; }
        button { background: #000; color: #fff; border: 1px solid #fff; padding: 10px 20px; cursor: pointer; }
        button:hover { background: #fff; color: #000; }
    </style>
</head>
<body>

    <h1>NEOWARE FIGURES</h1>
    
    <div class="grid" id="grid"></div>

    <div class="controls">
        <button onclick="downloadJSON()">СКАЧАТЬ JSON</button>
        <button onclick="clearGrid()">ОЧИСТИТЬ</button>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const size = 20;
        let matrix = Array(size).fill().map(() => Array(size).fill(0));
        for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.x = x;
                cell.dataset.y = y;
                cell.onclick = () => {
                    matrix[y][x] = matrix[y][x] === 0 ? 1 : 0;
                    cell.classList.toggle('active');
                };
                grid.appendChild(cell);
            }
        }

        function downloadJSON() {
            const data = {
                cx: 10, cy: 10,
                matrix: matrix.map(row => row.join(''))
            };
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const rand = Math.floor(100 + Math.random() * 899);
            a.href = url;
            a.download = `new_figure${rand}.json`;
            a.click();
        }

        function clearGrid() {
            matrix = Array(size).fill().map(() => Array(size).fill(0));
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
        }
    </script>
</body>
</html>
